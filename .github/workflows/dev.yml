name: PyBreeze Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        # Downloads are cached (PySide6 alone is hundreds of MB); pip still
        # resolves the newest versions from PyPI, so the run tests what a user
        # would install today
        cache: pip
        cache-dependency-path: |
          requirements.txt
          dev_requirements.txt
    - name: Update pip wheel setuptools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install dev dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Install test tooling
      run: python -m pip install pytest pytest-cov hypothesis
    - name: Install prthinker for the command-line contract test
      # prthinker is not on PyPI and needs Python 3.12+. One leg is enough to
      # check that the arguments and environment PyBreeze builds are still the
      # ones prthinker accepts (test/test_utils/test_prthinker_contract.py).
      if: matrix.python-version == '3.12'
      run: python -m pip install "prthinker[runner] @ https://github.com/JE-Chen/Code-Review-Framework-Combining-Large-Language-Models-and-Chain-of-Thought-Reasoning/archive/refs/heads/main.zip"
    - name: Run unit tests (pytest)
      run: python -m pytest test/test_utils/ -v --tb=short --cov=pybreeze --cov-branch --cov-report=xml
    - name: Upload coverage for analysis
      # One leg is enough; the scanner only consumes a single report.
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error
    - name: Run AutomationEditor With Debug Mode
      run: python ./test/unit_test/start_automation/start_automation_test.py
      env:
        PYTHONPATH: .
    - name: Extend AutomationEditor
      run: python ./test/unit_test/start_automation/extend_automation_test.py
      env:
        PYTHONPATH: .

  platform-smoke:
    # Linux and macOS. The whole suite runs on Windows (unit-tests); these legs
    # run the checks that say the IDE's basics work on a system at all
    # (test/test_utils/test_platform_smoke.py): a start, a child process, its
    # files, and Qt with no display. A system joins the unit-tests matrix once
    # the whole suite passes on it. Nothing waits for this job: publish-dev
    # needs unit-tests alone.
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          dev_requirements.txt
    - name: Install the system libraries Qt loads
      # The PySide6 wheels bring Qt, not the system libraries it links to
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
          libnss3 libxcomposite1 libxdamage1 libxrandr2 libxkbfile1 libpulse0 xvfb xauth
    - name: Update pip wheel setuptools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install dev dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Run the platform smoke tests with X11
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum python -m pytest test/test_utils/test_platform_smoke.py -v --tb=short
    - name: Run the platform smoke tests
      if: runner.os != 'Linux'
      run: python -m pytest test/test_utils/test_platform_smoke.py -v --tb=short

  nuitka-build:
    # The packaged executable: built as exe/build_nuitka.py builds it, then
    # checked by exe/check_build.py (it knows it is packaged, it answers as the
    # action language server, and the IDE starts). Nothing waits for this job:
    # a build takes long, and publish-dev needs unit-tests alone. A push to dev
    # keeps the build for a week, to be tried on a real machine.
    name: Nuitka build
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          dev_requirements.txt
    - name: Restore Nuitka's cache
      # The C compiler's output and the downloads; a build without it takes several times longer
      id: nuitka-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .nuitka-cache
        key: nuitka-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'dev_requirements.txt', 'exe/build_nuitka.py') }}
        restore-keys: nuitka-${{ runner.os }}-py3.12-
    - name: Update pip wheel setuptools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install dev dependencies
      run: python -m pip install -r dev_requirements.txt
    - name: Build the executable
      # Under the job's limit, so that a build too slow to finish still saves what it compiled
      timeout-minutes: 240
      run: python exe/build_nuitka.py
    - name: Save Nuitka's cache
      # Even when the build failed or ran out of time: the next one starts from what this one compiled
      if: always() && steps.nuitka-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .nuitka-cache
        key: nuitka-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'dev_requirements.txt', 'exe/build_nuitka.py') }}
    - name: Check the executable
      run: python exe/check_build.py exe/build/start_pybreeze.dist/PyBreeze.exe
    - name: Upload the compilation report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: nuitka-compilation-report
        path: exe/build/compilation-report.xml
        if-no-files-found: ignore
    - name: Upload the executable
      if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: PyBreeze-windows
        path: exe/build/start_pybreeze.dist
        retention-days: 7
        if-no-files-found: error

  sonarcloud:
    # Pull requests only. SonarCloud's plan for this organization exposes results
    # for the main branch and for pull requests; an analysis pushed for `dev`
    # succeeds but its results are not readable, so scanning every push here
    # would spend CI time on numbers nobody can see. Fork pull requests are
    # skipped because they cannot read the token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        # Sonar needs the full history to attribute new code to the right commits.
        fetch-depth: 0
    - name: Download coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: coverage-xml
    - name: Read package version
      # Without a version, SonarCloud's "previous version" new-code baseline has
      # nothing to anchor to and counts the whole history as new -- which is how
      # new_lines came to exceed the project's total line count.
      id: version
      run: echo "value=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
    - name: SonarQube Cloud scan
      # This is the public action commit pin, not an API key.
      # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
      with:
        args: -Dsonar.projectVersion=${{ steps.version.outputs.value }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

  publish-dev:
    # The dev channel. A push to dev that passes the tests is built from dev.toml
    # and uploaded when it is still the tip of dev and ships something the newest
    # pybreeze_dev does not. scripts/dev_release.py picks the version from PyPI,
    # so nothing is committed back. The job waits for the tests alone: sonarcloud
    # is skipped on a push, and a skipped dependency would skip this job too.
    name: Publish pybreeze_dev to PyPI
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    # What is installed here runs next to the PyPI token, so every package is
    # locked to a version and a hash, wheels only, and the runner's pip stays
    # as it is. .github/requirements/publish.in lists the tools and says how
    # the lock is regenerated.
    - name: Install build tools
      run: "python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt"
    - name: Write pyproject.toml from dev.toml with the next version
      run: python scripts/dev_release.py prepare
    # --no-isolation: the backend is the setuptools locked in publish.txt. An
    # isolated build would download the newest one from PyPI as the job runs.
    - name: Build package
      run: python -m build --no-isolation
    - name: Verify distribution metadata
      run: python -m twine check dist/*
    - name: Compare with the newest published wheel
      id: compare
      run: python scripts/dev_release.py changed dist
    # A run that finishes after a newer push would otherwise publish older code
    # as the newest release.
    - name: Check that this commit is still the tip of dev
      id: tip
      run: |
        tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
        if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
        echo "current=$current" >> "$GITHUB_OUTPUT"
    - name: Publish to PyPI
      if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: python -m twine upload --non-interactive dist/*
